<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects - Green Valley SRMS</title>
    
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        color: #222;
    }
    .sidebar {
        width: 220px;
        min-height: 100vh;
        background: #1f3c5b;
        color: white;
        position: fixed;
        left: 0;
        top: 0;
        padding: 20px 0;
    }
    .sidebar h2 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 20px;
    }
    .sidebar a {
        display: block;
        color: white;
        text-decoration: none;
        padding: 12px 22px;
    }
    .sidebar a:hover {
        background: #2f557c;
    }
    .main {
        margin-left: 220px;
        padding: 25px;
    }
    .topbar {
        background: white;
        padding: 18px 22px;
        border-radius: 8px;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .card {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
        gap: 18px;
    }
    .stat {
        background: white;
        padding: 22px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .stat h3 { margin-bottom: 10px; color: #1f3c5b; }
    .stat p { font-size: 26px; font-weight: bold; }
    form {
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
        gap: 15px;
    }
    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
    }
    input, select, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    button {
        background: #1f3c5b;
        color: white;
        border: none;
        padding: 11px 18px;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover { background: #2f557c; }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }
    th, td {
        padding: 11px;
        border: 1px solid #ddd;
        text-align: left;
    }
    th {
        background: #1f3c5b;
        color: white;
    }
    .actions a {
        text-decoration: none;
        margin-right: 8px;
        color: #1f3c5b;
    }
    .logout {
        margin-top: 25px;
        border-top: 1px solid rgba(255,255,255,0.2);
        padding-top: 10px;
    }
    @media (max-width: 760px) {
        .sidebar { position: static; width: 100%; min-height: auto; }
        .main { margin-left: 0; }
    }
</style>

</head>
<body>

<div class="sidebar">
    <h2>Green Valley SRMS</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="students.html">Students</a>
    <a href="teachers.html">Teachers</a>
    <a href="classes.html">Classes</a>
    <a href="subjects.html">Subjects</a>
    <a href="exams.html">Exams</a>
    <a href="reports.html">Reports</a>
    <div class="logout">
        <a href="login.html">Logout</a>
    </div>
</div>

<div class="main">
    <div class="topbar"><h1>Subjects</h1></div>
    
<div class="card">
    <h2>Add Subject</h2>
    <form>
        <div><label>Subject Code</label><input type="text" required></div>
        <div><label>Subject Name</label><input type="text" required></div>
        <div><label>Teacher</label><input type="text"></div>
        <div><button type="submit">Save Subject</button></div>
    </form>
</div>
<div class="card">
    <h2>Subject List</h2>
    <table>
        <tr><th>Code</th><th>Subject</th><th>Teacher</th><th>Action</th></tr>
        <tr><td>MAT</td><td>Mathematics</td><td>John Mwangi</td><td class="actions"><a href="#">Edit</a><a href="#">Delete</a></td></tr>
        <tr><td>ENG</td><td>English</td><td>Jane Wambui</td><td class="actions"><a href="#">Edit</a><a href="#">Delete</a></td></tr>
    </table>
</div>

</div>
</body>
</html>
