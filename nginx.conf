server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block access to sensitive files
    location ~ /\.(env|git|ht) {
        deny all;
        return 404;
    }

    # Block access to vendor directory
    location ~ /vendor/ {
        deny all;
        return 404;
    }

    # Block access to SQL directory
    location ~ /sql/ {
        deny all;
        return 404;
    }

    # Block access to config directory
    location ~ /config/ {
        deny all;
        return 404;
    }

    # Block access to sensitive PHP files
    location ~ /create_admin\.php$ {
        deny all;
        return 404;
    }

    # Block access to Docker and compose files
    location ~ /\.(docker|docker-compose) {
        deny all;
        return 404;
    }

    # Handle PHP files
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_index index.php;
    }

    # Serve static files with caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Default location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
