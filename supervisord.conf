[supervisord]
nodaemon=true

[program:php-fpm]
command=php-fpm --nodaemon --fpm-config /var/www/html/php-fpm-pool.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/php-fpm.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.log
