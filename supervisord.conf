[supervisord]
nodaemon=true

[program:php-fpm]
command=php-fpm -R --nodaemon
environment=SMTP_HOST="%(env_SMTP_HOST)s",SMTP_PORT="%(env_SMTP_PORT)s",SMTP_USER="%(env_SMTP_USER)s",SMTP_PASS="%(env_SMTP_PASS)s",SMTP_FROM="%(env_SMTP_FROM)s",APP_BASE_URL="%(env_APP_BASE_URL)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/php-fpm.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.log
