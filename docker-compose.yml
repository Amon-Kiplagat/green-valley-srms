version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: greenvalley_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: green_valley
      POSTGRES_USER: greenvalley
      POSTGRES_PASSWORD: ${DB_PASS:-GreenValley2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./sql/migration_2026_11_student_portal.sql:/docker-entrypoint-initdb.d/03-migration.sql
    ports:
      - "5432:5432"
    networks:
      - greenvalley_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenvalley -d green_valley"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP-FPM Application
  app:
    build: .
    container_name: greenvalley_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: green_valley
      DB_USER: greenvalley
      DB_PASS: ${DB_PASS:-GreenValley2026}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - greenvalley_network

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: greenvalley_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - greenvalley_network

volumes:
  postgres_data:
    driver: local

networks:
  greenvalley_network:
    driver: bridge
