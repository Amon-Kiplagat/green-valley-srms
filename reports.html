<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Green Valley SRMS</title>
    
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        color: #222;
    }
    .sidebar {
        width: 220px;
        min-height: 100vh;
        background: #1f3c5b;
        color: white;
        position: fixed;
        left: 0;
        top: 0;
        padding: 20px 0;
    }
    .sidebar h2 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 20px;
    }
    .sidebar a {
        display: block;
        color: white;
        text-decoration: none;
        padding: 12px 22px;
    }
    .sidebar a:hover {
        background: #2f557c;
    }
    .main {
        margin-left: 220px;
        padding: 25px;
    }
    .topbar {
        background: white;
        padding: 18px 22px;
        border-radius: 8px;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .card {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
        gap: 18px;
    }
    .stat {
        background: white;
        padding: 22px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .stat h3 { margin-bottom: 10px; color: #1f3c5b; }
    .stat p { font-size: 26px; font-weight: bold; }
    form {
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
        gap: 15px;
    }
    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
    }
    input, select, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    button {
        background: #1f3c5b;
        color: white;
        border: none;
        padding: 11px 18px;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover { background: #2f557c; }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }
    th, td {
        padding: 11px;
        border: 1px solid #ddd;
        text-align: left;
    }
    th {
        background: #1f3c5b;
        color: white;
    }
    .actions a {
        text-decoration: none;
        margin-right: 8px;
        color: #1f3c5b;
    }
    .logout {
        margin-top: 25px;
        border-top: 1px solid rgba(255,255,255,0.2);
        padding-top: 10px;
    }
    @media (max-width: 760px) {
        .sidebar { position: static; width: 100%; min-height: auto; }
        .main { margin-left: 0; }
    }
</style>

</head>
<body>

<div class="sidebar">
    <h2>Green Valley SRMS</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="students.html">Students</a>
    <a href="teachers.html">Teachers</a>
    <a href="classes.html">Classes</a>
    <a href="subjects.html">Subjects</a>
    <a href="exams.html">Exams</a>
    <a href="reports.html">Reports</a>
    <div class="logout">
        <a href="login.html">Logout</a>
    </div>
</div>

<div class="main">
    <div class="topbar"><h1>Reports</h1></div>
    
<div class="card">
    <h2>Generate Report</h2>
    <form>
        <div><label>Student</label><select><option>GV001 - Mary Wanjiku</option><option>GV002 - Peter Kamau</option></select></div>
        <div><label>Term</label><select><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></div>
        <div><label>Year</label><input type="number" value="2026"></div>
        <div><button type="submit">Generate Report</button></div>
    </form>
</div>
<div class="card">
    <h2>Student Report Preview</h2>
    <p><strong>Student:</strong> Mary Wanjiku</p>
    <p><strong>Admission Number:</strong> GV001</p>
    <p><strong>Class:</strong> Form 2</p>
    <table>
        <tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>
        <tr><td>Mathematics</td><td>78</td><td>A</td></tr>
        <tr><td>English</td><td>72</td><td>B+</td></tr>
        <tr><td>Kiswahili</td><td>75</td><td>A-</td></tr>
    </table>
    <br>
    <button onclick="window.print()">Print Report</button>
</div>

</div>
</body>
</html>
